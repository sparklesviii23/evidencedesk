[project]
name = "evidencedesk"
version = "0.1.0"
description = "Local-first systematic review and meta-analysis workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "rapidfuzz>=3.9",
  "keyring>=25",
  "mcp>=2.0",
  "python-multipart>=0.0.9",
  "lxml>=5.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
[project.scripts]
evidencedesk = "evidencedesk.cli:main"
evidencedesk-mcp = "evidencedesk.mcp_server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["evidencedesk"]
